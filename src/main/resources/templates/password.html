<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            max-width: 400px;
            margin: 80px auto;
            padding: 0 20px;
        }

        h1 {
            color: #0F2443;
            border-bottom: 3px solid #14B8A6;
            padding-bottom: 8px;
            text-align: center;
        }

        .field {
            margin: 16px 0;
        }

        label {
            display: block;
            font-weight: bold;
            color: #0F2443;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #14B8A6;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:hover {
            background: #0D9488;
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
            display: block;
            color: #0F2443;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>修改密碼</h1>

    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <div th:if="${#fields.hasErrors('passwordForm.*')}" class="error">
        <div th:each="err : ${#fields.errors('passwordForm.*')}" th:text="${err}"></div>
    </div>

    <form th:action="@{/password}" th:object="${passwordForm}" method="post">
        <div class="field">
            <label>舊密碼</label>
            <input type="password" th:field="*{oldPassword}" placeholder="請輸入舊密碼">
        </div>

        <div class="field">
            <label>新密碼</label>
            <input type="password" th:field="*{newPassword}" placeholder="至少 8 碼">
        </div>

        <div class="field">
            <label>確認新密碼</label>
            <input type="password" th:field="*{confirmPassword}" placeholder="請再次輸入新密碼">
        </div>

        <button type="submit">確認修改</button>
    </form>

    <a th:href="@{/dashboard}" class="back-link">← 返回儀表板</a>
</body>

</html>
