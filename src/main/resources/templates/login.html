<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>醫師登入 - MiniClinic</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            max-width: 400px;
            margin: 80px auto;
            padding: 0 20px;
        }

        h1 {
            color: #0F2443;
            border-bottom: 3px solid #14B8A6;
            padding-bottom: 8px;
            text-align: center;
        }

        .field {
            margin: 16px 0;
        }

        label {
            display: block;
            font-weight: bold;
            color: #0F2443;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background: #14B8A6;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:hover {
            background: #0D9488;
        }

        .error {
            background: #FEE2E2;
            color: #991B1B;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .home-link {
            text-align: center;
            margin-top: 20px;
            display: block;
            color: #0F2443;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>MiniClinic 醫師登入</h1>

    <!-- 登入失敗的錯誤訊息 -->
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <form th:action="@{/login}" th:object="${loginForm}" method="post">
        <div class="field">
            <label>醫師編號</label>
            <input type="text" th:field="*{doctorId}" placeholder="例如：D001">
            <div class="error" style="margin-top: 6px; padding: 6px;" th:if="${#fields.hasErrors('doctorId')}"
                th:errors="*{doctorId}"></div>
        </div>

        <div class="field">
            <label>密碼</label>
            <input type="password" th:field="*{password}" placeholder="請輸入密碼">
            <div class="error" style="margin-top: 6px; padding: 6px;" th:if="${#fields.hasErrors('password')}"
                th:errors="*{password}"></div>
        </div>

        <button type="submit">登入</button>
    </form>

    <a th:href="@{/}" class="home-link">← 回首頁</a>
</body>

</html>
