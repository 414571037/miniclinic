<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>掛號統計 - MiniClinic</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #0F2443;
            border-bottom: 3px solid #14B8A6;
            padding-bottom: 8px;
        }

        nav {
            background: #0F2443;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: #F8FAFC;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #14B8A6;
        }

        .card h2 {
            margin: 0;
            color: #64748B;
            font-size: 16px;
        }

        .card p {
            margin: 10px 0 0;
            font-size: 32px;
            font-weight: bold;
            color: #0F2443;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #0F2443;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #E2E8F0;
        }
    </style>
</head>

<body>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/appointments}">掛號記錄</a>
        <a th:href="@{/stats}">掛號統計</a>
    </nav>

    <h1>全院掛號統計</h1>

    <div class="stats-grid">
        <div class="card">
            <h2>醫師總數</h2>
            <p th:text="${doctorCount}">0</p>
        </div>
        <div class="card">
            <h2>病患總數</h2>
            <p th:text="${patientCount}">0</p>
        </div>
        <div class="card">
            <h2>掛號總數</h2>
            <p th:text="${appointmentCount}">0</p>
        </div>
    </div>

    <h2>依科別掛號數統計</h2>
    <table>
        <thead>
            <tr>
                <th>科別名稱</th>
                <th>累積掛號人次</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="stat : ${deptStats}">
                <td th:text="${stat[0]}">科別</td>
                <td th:text="${stat[1]}">0</td>
            </tr>
        </tbody>
    </table>

    <p style="margin-top: 40px;">
        <a th:href="@{/appointments}">← 查看詳細掛號清單</a>
    </p>
</body>

</html>
